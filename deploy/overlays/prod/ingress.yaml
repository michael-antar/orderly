apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: orderly
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        # Must match `domain` in infra/terraform.tfvars.
        - example.com
      secretName: origin-tls
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
