apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../secrets
  - ingress.yaml
images:
  # CI rewrites `newTag` with the commit SHA after each successful image build.
  - name: orderly-web
    newName: ghcr.io/michael-antar/orderly-web
    newTag: unset
