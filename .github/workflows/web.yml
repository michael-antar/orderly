name: web

on:
  pull_request:
  push:
    branches: [main, 'phase-*']
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - 'Dockerfile'
      - '.dockerignore'
      - 'nginx/**'
      - '.github/workflows/web.yml'

# `deploy/**` is deliberately absent from `paths`: the tag-bump commit this
# workflow pushes must never retrigger it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  image:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    concurrency:
      group: web-image-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/orderly-web:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in prod overlay
        env:
          TAG: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          yq -i '(.images[] | select(.name == "orderly-web")).newTag = strenv(TAG)' deploy/overlays/prod/kustomization.yaml
          git add deploy/overlays/prod/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy(web): ${TAG:0:7}"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
