---
- name: Provision the Orderly home server
  hosts: orderly
  become: true
  gather_facts: true
  vars:
    k3s_version: v1.36.5+k3s1
    ssh_public_key_path: ~/.ssh/id_ed25519.pub
  tasks:
    - name: Validate required inventory values
      ansible.builtin.assert:
        that:
          - lan_cidr is defined
          - lan_cidr | ansible.utils.ipaddr('network')
          - ssh_public_key_path is defined
        fail_msg: Set lan_cidr and ssh_public_key_path in inventory.ini.

    - name: Read the operator SSH public key
      ansible.builtin.set_fact:
        operator_ssh_public_key: "{{ lookup('file', ssh_public_key_path | expanduser) | trim }}"
      delegate_to: localhost
      become: false

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - fail2ban
          - gnupg
          - openssh-server
          - smartmontools
          - sudo
          - ufw
          - unattended-upgrades
        state: present
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist

    - name: Create the operations user
      ansible.builtin.user:
        name: ops
        groups: sudo
        append: true
        shell: /bin/bash
        create_home: true

    - name: Authorize the operator SSH key
      ansible.posix.authorized_key:
        user: ops
        key: '{{ operator_ssh_public_key }}'
        state: present
        manage_dir: true

    - name: Allow passwordless sudo for provisioning and recovery
      ansible.builtin.copy:
        dest: /etc/sudoers.d/orderly-ops
        content: "ops ALL=(ALL) NOPASSWD:ALL\n"
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Harden SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-orderly.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
        mode: '0644'
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: '0644'

    - name: Permit clean automatic reboots after security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52orderly-unattended-upgrades
        content: |
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "10:00";
        mode: '0644'

    - name: Install the Tailscale repository key
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'

    - name: Enable the Tailscale repository
      ansible.builtin.deb822_repository:
        name: tailscale
        types: deb
        uris: https://pkgs.tailscale.com/stable/ubuntu
        suites: noble
        components: main
        signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
        state: present

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

    - name: Enable Tailscale
      ansible.builtin.service:
        name: tailscaled
        enabled: true
        state: started

    - name: Enable fail2ban
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started

    - name: Enable storage health monitoring
      ansible.builtin.service:
        name: smartmontools
        enabled: true
        state: started

    - name: Persist IPv4 forwarding for k3s
      ansible.builtin.lineinfile:
        path: /etc/ufw/sysctl.conf
        regexp: ^#?net/ipv4/ip_forward=
        line: net/ipv4/ip_forward=1
        mode: '0644'
      register: ufw_ipv4_forwarding

    - name: Activate IPv4 forwarding when the UFW setting changes
      ansible.builtin.command: /usr/sbin/sysctl -w net.ipv4.ip_forward=1
      when: ufw_ipv4_forwarding is changed
      changed_when: false

    - name: Default-deny inbound host traffic
      ansible.builtin.ufw:
        default: deny
        direction: incoming

    - name: Default-allow outbound host traffic
      ansible.builtin.ufw:
        default: allow
        direction: outgoing

    - name: Default-deny routed host traffic
      ansible.builtin.ufw:
        default: deny
        direction: routed

    - name: Allow SSH from the LAN
      ansible.builtin.ufw:
        rule: allow
        proto: tcp
        port: '22'
        src: '{{ lan_cidr }}'
        comment: Orderly LAN SSH

    - name: Allow SSH through Tailscale
      ansible.builtin.ufw:
        rule: allow
        interface: tailscale0
        direction: in
        proto: tcp
        port: '22'
        comment: Orderly Tailscale SSH

    - name: Allow Kubernetes API access from the LAN
      ansible.builtin.ufw:
        rule: allow
        proto: tcp
        port: '6443'
        src: '{{ lan_cidr }}'
        comment: Orderly LAN Kubernetes API

    - name: Allow Kubernetes API access through Tailscale
      ansible.builtin.ufw:
        rule: allow
        interface: tailscale0
        direction: in
        proto: tcp
        port: '6443'
        comment: Orderly Tailscale Kubernetes API

    - name: Allow k3s pod traffic
      ansible.builtin.ufw:
        rule: allow
        src: 10.42.0.0/16
        comment: k3s pods

    - name: Allow k3s service traffic
      ansible.builtin.ufw:
        rule: allow
        src: 10.43.0.0/16
        comment: k3s services

    - name: Allow routed k3s pod traffic
      ansible.builtin.ufw:
        rule: allow
        route: true
        src: 10.42.0.0/16
        comment: k3s routed pods

    - name: Enable the host firewall
      ansible.builtin.ufw:
        state: enabled
        logging: 'off'

    - name: Check whether k3s is installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Download the k3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/orderly-k3s-install.sh
        mode: '0700'
      when: not k3s_binary.stat.exists

    - name: Install k3s
      ansible.builtin.command: /tmp/orderly-k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: '{{ k3s_version }}'
        INSTALL_K3S_EXEC: server --write-kubeconfig-mode 0600
      when: not k3s_binary.stat.exists

    - name: Enable k3s
      ansible.builtin.service:
        name: k3s
        enabled: true
        state: started

    - name: Wait for the k3s node to become ready
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes --no-headers
      register: k3s_nodes
      changed_when: false
      retries: 12
      delay: 5
      until: k3s_nodes.stdout is search('\\bReady\\b')

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
